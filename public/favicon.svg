<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2C7A7B"/>
      <stop offset="100%" stop-color="#1A4040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Tent: bold white triangle, fills most of the icon -->
  <path d="M50 10 L92 68 L8 68 Z" fill="white"/>

  <!-- Tent door: big enough to read at 16px -->
  <path d="M50 68 L40 50 Q50 42 60 50 Z" fill="#1A4040"/>

  <!-- Backpack: simplified to two bold shapes only -->
  <!-- Body -->
  <rect x="39" y="60" width="22" height="24" rx="5" fill="#4FD1C5"/>
  <!-- Top compartment -->
  <rect x="42" y="53" width="16" height="10" rx="3" fill="#4FD1C5"/>
</svg>
